server {
    listen 80;
    listen 3000;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript application/vnd.apple.mpegurl;

    # Stream reverse proxy to bypass Mixed Content (HTTP on HTTPS) and CORS
    location ~* ^/stream-proxy/(https?)[/:]+([^/]+)/?(.*)$ {
        set $target_proto $1;
        set $target_host $2;
        set $target_path $3;

        resolver 8.8.8.8 1.1.1.1 8.8.4.4 valid=300s ipv6=off;
        resolver_timeout 5s;

        proxy_pass $target_proto://$target_host/$target_path$is_args$args;
        proxy_set_header Host $target_host;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";
        proxy_set_header Referer "";
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Force permissive CORS headers
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
